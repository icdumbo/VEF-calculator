plugins { id 'com.android.application' }

android {
    namespace 'app.vessel.vef.basic'
    compileSdk 36
    defaultConfig {
        applicationId 'app.vessel.vef.basic'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.0-admob-test1'
    }
    buildTypes {
        debug {
            debuggable true
            versionNameSuffix '-test3'
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }
    signingConfigs {
        debug {
            storeFile file(System.getenv('VEF_TEST_KEYSTORE') ?: rootProject.file('.local-signing/test.jks'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

apply from: rootProject.file('release-signing.gradle')

dependencies { implementation 'com.google.android.gms:play-services-ads:25.5.0' }
